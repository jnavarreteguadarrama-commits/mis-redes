<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Redes</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #050505, #181818, #252525);
    display: flex;
    justify-content: center;
    align-items: center;
}

.redes {
    width: 90%;
    max-width: 450px;
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.boton {
    width: 100%;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    text-decoration: none;
    color: white;
    font-size: 21px;
    font-weight: bold;
    transition: 0.3s;
}

.boton:hover {
    transform: scale(1.05);
}

.tiktok {
    background: #111111;
    border: 2px solid #444444;
}

.youtube {
    background: #ff0000;
}

.kick {
    background: #53fc18;
    color: black;
}

.twitch {
    background: #9146ff;
}
</style>
</head>

<body>

<div class="redes">

    <a class="boton tiktok"
       href="https://www.tiktok.com/@clahsroyale789"
       target="_blank">
       TikTok
    </a>

    <a class="boton youtube"
       href="https://www.youtube.com/channel/UCCNiy7MdAwAJQd68u2bmwRA"
       target="_blank">
       YouTube
    </a>

    <a class="boton kick"
       href="https://kick.com/guadarrama23"
       target="_blank">
       Kick
    </a>

    <a class="boton twitch"
       href="https://www.twitch.tv/puroclip48"
       target="_blank">
       Twitch
    </a>

</div>

</body>
</html>
